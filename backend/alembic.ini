[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: sqlalchemy.url is deliberately EMPTY. env.py reads
# MIGRATION_DATABASE_URL so the migration target is pinned per environment and
# cannot fall through to whatever DATABASE_URL happens to be set (Appendix D.3).
sqlalchemy.url =

[post_write_hooks]
# `exec` rather than `console_scripts`: ruff ships as a standalone binary, so
# there is no console-script entry point for alembic to import.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
