[project]
name = "interview-app-backend"
version = "0.1.0"
requires-python = ">=3.13"
description = "AI interview platform -- backend (see REQUIREMENTS_SPEC.md)"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",  # assert: used deliberately in tests and invariant checks
  "B008",  # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]
# Authored interview content is prose. Reflowing a candidate-facing sentence to
# satisfy a column limit makes it harder to read, which is the wrong trade for
# text a human reviews.
"app/content/bank_*.py" = ["E501"]
"app/content/taxonomy.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
exclude = "alembic/versions"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "celery.*", "docx.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs postgres/redis",
  "invariance: enforces IR-3 score invariance (release blocker on failure)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]
