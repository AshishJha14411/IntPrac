name: CI

on:
  # `dev` is where work lands; `main` is what deploys. Push only -- there is no
  # `pull_request` trigger, because a PR from dev to main has the same head SHA
  # that was already built on push, and building it twice buys nothing.
  #
  # This does not weaken branch protection: required status checks match by
  # commit SHA, not by trigger, so the run from the push to `dev` is what
  # satisfies the gate on the PR. The one thing it gives up is testing the
  # *merge* commit, which matters only when main has moved on since dev
  # branched -- at which point rebasing dev re-triggers CI anyway.
  push: { branches: [main, dev] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and fast. A leaked credential is the one CI failure you cannot
  # fix by pushing another commit -- once it is in the history it has to be
  # rotated, so this is worth 20 seconds on every PR.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # scan history, not just the diff
      # The tool directly, not `gitleaks/gitleaks-action`. The wrapper action
      # contacts a licence server and fails closed without a key -- which it
      # did here on the first run, reporting a "secret scanning failure" when
      # the repository was in fact clean. A security check that cries wolf on
      # day one is a check people disable in week two. Same binary, no licence,
      # exit code we control.
      - name: Scan for committed credentials
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --log-opts="--all" --redact --no-banner \
            --exit-code 1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U interview" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20

    env:
      ENVIRONMENT: test
      LLM_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://interview:interview@localhost:5432/interview
      SYNC_DATABASE_URL: postgresql+psycopg://interview:interview@localhost:5432/interview
      # Pinned explicitly. Never let this fall through to an inherited value.
      MIGRATION_DATABASE_URL: postgresql+psycopg://interview:interview@localhost:5432/interview
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run: { working-directory: backend }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy app
        continue-on-error: true # advisory until the annotations are complete

      - name: Migrations apply cleanly from scratch
        run: alembic upgrade head

      - name: Question bank meets the authoring bar
        run: python -m app.content.seed

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

      # Called out separately so a failure here is unmistakable in the log:
      # prose leaking into scoring is a release blocker, not a flaky test.
      - name: Score-invariance gate (IR-3)
        run: pytest -q -m invariance

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  smoke:
    # The suite cannot catch MissingGreenlet -- the test session is sync behind
    # an async facade. Only a real run against the async engine can.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis minio minio-init
          docker compose run --rm migrate
          docker compose run --rm seed
          docker compose up -d api worker beat
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health/ready && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Smoke
        # `bash <script>` rather than `./<script>`: the executable bit is a git
        # file mode, and a Windows checkout does not carry one -- so the bit can
        # silently go missing again on any future file. Invoking the
        # interpreter explicitly does not care. The bit is set too; this is the
        # belt to that braces.
        run: bash ./scripts/smoke.sh
      # A failing smoke run used to mean scrolling 200 interleaved lines to find
      # out which of six containers died. This writes a short digest to the job
      # summary page -- container states first, then only the log lines that
      # matter -- so the cause is visible without opening the raw log at all.
      - name: Diagnose on failure
        if: failure()
        run: |
          {
            echo '## Smoke failed'
            echo '### Container states'
            echo '```'; docker compose ps -a; echo '```'
            for svc in api worker beat; do
              echo "### $svc (last 40)"
              echo '```'; docker compose logs --tail 40 --no-color "$svc" 2>&1 || true; echo '```'
            done
            echo '### Tracebacks and errors anywhere in the stack'
            echo '```'
            docker compose logs --no-color 2>&1 \
              | grep -iE "traceback|error|exception|critical|refused|timeout" \
              | tail -40 || echo "(none matched)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker compose logs --tail 200 --no-color

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-backend:ci ./backend
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: interview-backend:ci
          format: table
          # Report-only. A CVE disclosed upstream should not redden an
          # unrelated PR; flip to enforcing once the baseline is clean.
          exit-code: "0"
        continue-on-error: true
