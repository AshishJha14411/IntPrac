name: Deploy

# Only after CI has gone green on main, and only ever from main. A deploy that
# can run on a red build is a deploy that will eventually ship a red build.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual re-run, for a rollback or a config-only change.
  workflow_dispatch:

concurrency:
  # Never two deploys at once: the second would race the first's migration.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for Google's keyless auth -- see below

jobs:
  backend:
    # `workflow_run` fires on failure too, so the result has to be checked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # gate approvals/secrets here, in the repo settings
    steps:
      - uses: actions/checkout@v4

      # Keyless. Workload Identity Federation trades a short-lived GitHub OIDC
      # token for a Google one, so there is no long-lived service-account JSON
      # in repo secrets to leak or rotate. It is more console setup once and
      # less to worry about forever.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/interview/api:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Migrations run as a one-off Job *before* the new revision serves
      # traffic. The other order deploys code that expects a column the
      # database does not have yet, and the failure lands on users rather than
      # here. Note it uses the DIRECT Neon endpoint: DDL through a transaction
      # pooler is how you get a half-applied migration.
      - name: Migrate
        run: |
          gcloud run jobs deploy interview-migrate \
            --image "$IMAGE" --region "${{ secrets.GCP_REGION }}" \
            --command alembic --args "upgrade,head" \
            --set-secrets "MIGRATION_DATABASE_URL=interview-migration-db-url:latest" \
            --max-retries 0 --quiet
          gcloud run jobs execute interview-migrate \
            --region "${{ secrets.GCP_REGION }}" --wait --quiet

      # Seeding is idempotent (it validates the authoring bar, then upserts),
      # so it runs every deploy rather than being a thing someone remembers.
      - name: Seed the question bank
        run: |
          gcloud run jobs deploy interview-seed \
            --image "$IMAGE" --region "${{ secrets.GCP_REGION }}" \
            --command python --args "-m,app.content.seed" \
            --set-secrets "SYNC_DATABASE_URL=interview-sync-db-url:latest" \
            --max-retries 0 --quiet
          gcloud run jobs execute interview-seed \
            --region "${{ secrets.GCP_REGION }}" --wait --quiet

      - name: Deploy the API
        run: |
          # Storage, shared with the scheduled jobs below -- retention deletes
          # objects, so it needs the same endpoint the API signs uploads
          # against. Both defaulted to http://localhost:9000, the MinIO the dev
          # stack runs, and nothing here overrode them: the API would have
          # started cleanly and signed upload URLs pointing at the user's own
          # laptop. GCS speaks the S3 XML API at one global host, so unlike
          # MinIO there is no separate in-cluster address to distinguish.
          COMMON_STORAGE="S3_ENDPOINT_URL=https://storage.googleapis.com"
          COMMON_STORAGE="$COMMON_STORAGE;S3_PUBLIC_ENDPOINT_URL=https://storage.googleapis.com"
          COMMON_STORAGE="$COMMON_STORAGE;S3_BUCKET_UPLOADS=${{ secrets.GCS_BUCKET }}"
          COMMON_STORAGE="$COMMON_STORAGE;S3_REGION=${{ secrets.GCP_REGION }}"
          echo "COMMON_STORAGE=$COMMON_STORAGE" >> "$GITHUB_ENV"

          # `^;^` switches gcloud's list delimiter from comma to semicolon,
          # because CORS_ORIGINS is itself comma-separated: with the default
          # delimiter a second origin parses as a new variable named after a
          # URL and gcloud rejects the deploy.
          #
          # AUTH_COOKIE_SAMESITE=none is load-bearing and was missing. The UI
          # is on Vercel and the API on Cloud Run -- different sites, so a
          # `lax` cookie is not sent with the request at all and every call
          # arrives anonymous. It pairs with Secure=true, since browsers drop
          # a `none` cookie that is not Secure, so setting either one alone
          # locks everybody out just as completely.
          # tests/unit/test_env_examples.py has asserted that pair for the
          # example file all along. Nothing asserted it for the thing that
          # actually deploys, which is where it was wrong.
          #
          # CELERY_BROKER_URL and CELERY_RESULT_BACKEND get the same Redis as
          # the app. Eager mode never dials either, so this changes nothing
          # today -- but they defaulted to localhost:6379, so turning
          # CELERY_TASK_ALWAYS_EAGER off in the console would not have moved
          # this to broker mode, it would have hung against a Redis that is
          # not there. Upstash serves one logical database rather than the
          # sixteen a local Redis has, so compose's db-number split collapses
          # here; harmless while nothing publishes.
          gcloud run deploy interview-api \
            --image "$IMAGE" --region "${{ secrets.GCP_REGION }}" \
            --platform managed --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 1Gi \
            --min-instances 0 --max-instances 3 \
            --set-env-vars "^;^ENVIRONMENT=production;LOG_FORMAT=json;CELERY_TASK_ALWAYS_EAGER=true;CORS_ORIGINS=${{ secrets.FRONTEND_ORIGIN }};FRONTEND_BASE_URL=${{ secrets.FRONTEND_ORIGIN }};GOOGLE_REDIRECT_URI=${{ secrets.API_ORIGIN }}/api/v1/auth/google/callback;AUTH_COOKIE_SECURE=true;AUTH_COOKIE_SAMESITE=none;$COMMON_STORAGE" \
            --set-secrets "DATABASE_URL=interview-db-url:latest,SYNC_DATABASE_URL=interview-sync-db-url:latest,MIGRATION_DATABASE_URL=interview-migration-db-url:latest,REDIS_URL=interview-redis-url:latest,CELERY_BROKER_URL=interview-redis-url:latest,CELERY_RESULT_BACKEND=interview-redis-url:latest,JWT_SECRET=interview-jwt-secret:latest,GEMINI_API_KEY=interview-gemini-key:latest,GOOGLE_CLIENT_ID=interview-google-client-id:latest,GOOGLE_CLIENT_SECRET=interview-google-client-secret:latest,S3_ACCESS_KEY_ID=interview-s3-key-id:latest,S3_SECRET_ACCESS_KEY=interview-s3-secret:latest" \
            --quiet
          # `min-instances 0` is the whole cost model (ADR 010): nothing is
          # billed while idle, which only works because there is no worker.

      # ---------------------------------------------------------------------
      # Scheduled work, without a process that waits around to do it.
      #
      # Deleting beat along with the worker removed the only thing that ran
      # retention. `app/entrypoints/jobs.py` existed for exactly this, but
      # nothing invoked it -- so the six-month window was enforced by a
      # docstring. Cloud Run Jobs cost nothing between executions, so this is
      # the same bill as the always-on worker we removed: zero.
      #
      # Two jobs rather than one parameterised job, so each has its own
      # schedule and its own failure history in the console.
      # ---------------------------------------------------------------------
      - name: Deploy the scheduled jobs
        run: |
          for job in retention drain; do
            gcloud run jobs deploy "interview-$job" \
              --image "$IMAGE" --region "${{ secrets.GCP_REGION }}" \
              --command python --args "-m,app.entrypoints.jobs,$job" \
              --set-env-vars "^;^ENVIRONMENT=production;LOG_FORMAT=json;CELERY_TASK_ALWAYS_EAGER=true;CORS_ORIGINS=${{ secrets.FRONTEND_ORIGIN }};$COMMON_STORAGE" \
              --set-secrets "DATABASE_URL=interview-db-url:latest,SYNC_DATABASE_URL=interview-sync-db-url:latest,REDIS_URL=interview-redis-url:latest,GEMINI_API_KEY=interview-gemini-key:latest,S3_ACCESS_KEY_ID=interview-s3-key-id:latest,S3_SECRET_ACCESS_KEY=interview-s3-secret:latest" \
              --max-retries 1 --task-timeout 15m --quiet
          done

      - name: Schedule them
        run: |
          REGION="${{ secrets.GCP_REGION }}"
          PROJECT="${{ secrets.GCP_PROJECT }}"
          SA="${{ secrets.GCP_SERVICE_ACCOUNT }}"

          # `gcloud scheduler jobs create` is not idempotent -- it fails if the
          # job exists, which is every deploy after the first. describe-then-
          # branch keeps this step re-runnable, which a deploy step has to be.
          schedule() {
            name="$1"; cron="$2"; target="$3"
            uri="https://$REGION-run.googleapis.com/apis/run.googleapis.com/v1"
            uri="$uri/namespaces/$PROJECT/jobs/$target:run"
            verb=create
            gcloud scheduler jobs describe "$name" --location="$REGION" \
              --quiet >/dev/null 2>&1 && verb=update
            gcloud scheduler jobs "$verb" http "$name" \
              --location="$REGION" --schedule="$cron" --time-zone="Etc/UTC" \
              --uri="$uri" --http-method=POST \
              --oauth-service-account-email="$SA" \
              --attempt-deadline=30m --quiet
          }

          # Retention: once a night, off the hour so it does not land in the
          # same minute as every other cron on the planet.
          schedule interview-retention-nightly "17 3 * * *" interview-retention

          # Outbox sweeper. The request seam already drains after every commit
          # (ADR 010), so this is a backstop for one specific case: an event
          # whose inline drain failed on a request that was the last traffic
          # the app saw. Without it that row waits for the next visitor, which
          # on a quiet day is tomorrow. Hourly bounds the damage while staying
          # inside Cloud Scheduler's free tier.
          schedule interview-outbox-sweep "23 * * * *" interview-drain

      # Deploying and *working* are different claims. This asserts the running
      # revision is the one we built and is in the dispatch mode we intend --
      # the exact thing that was wrong in v1 for weeks with nobody noticing.
      - name: Verify the revision that is actually serving
        run: |
          READY=$(curl -fsS "${{ secrets.API_ORIGIN }}/api/v1/health/ready")
          echo "$READY"
          echo "$READY" | grep -q '"dispatch":"inline"' \
            || { echo "::error::deployed revision is not in workerless mode"; exit 1; }
          echo "$READY" | grep -q '"database":"ok"' \
            || { echo "::error::deployed revision cannot reach the database"; exit 1; }

      - name: Roll back on a failed verification
        if: failure()
        run: |
          echo "::warning::routing traffic back to the previous revision"
          PREV=$(gcloud run revisions list --service interview-api \
            --region "${{ secrets.GCP_REGION }}" --format="value(name)" \
            --sort-by="~metadata.creationTimestamp" | sed -n 2p)
          [ -n "$PREV" ] && gcloud run services update-traffic interview-api \
            --region "${{ secrets.GCP_REGION }}" --to-revisions "$PREV=100" --quiet

  frontend:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    needs: backend # the UI must never be newer than the API it calls
    # That ordering is the reason `frontend/vercel.json` sets
    # git.deploymentEnabled to false for main and dev. Vercel's Git
    # integration would otherwise deploy on push, in parallel with this job and
    # without waiting for the migration -- so a release that adds a column and
    # the UI that reads it would race, and the UI would usually win. Turning
    # the Git trigger off leaves exactly one path to production.
    #
    # To hand the frontend back to Vercel instead, delete that file and this
    # job together. Do not keep both.
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm i -g vercel@latest
      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          # `npm run build` fetches the 40 MB Vosk model into public/models so
          # the on-device recogniser is served from our own origin rather than
          # a third-party CDN that could be down mid-interview (ADR 011).
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
